# Data Contract v0.1 (Seed Schema) — docs/02와 항상 동기화한다. 이 파일이 곧 제품이다.
# 여섯 곳(추출 출력·서버 검증·DB·Field 폼·대시보드 필터·에이전트 입력)이 이 정의를 공유한다.
# 변경은 SCP → Steward 승인 → 새 버전 파일로만 (추가만 허용, docs/02 §7.5). AI 자동 변경 금지 (절대 규칙 #4).
# v0.1에는 의도적으로 POST_STROKE가 없다 — SCP → v0.2 승격 시연 각본 (DECISIONS 08/11).
# 08/21 재확정(첫 추출 실행 전 1회): patient_segment에 GENERALIZED_PGTC·LGS 추가 — 코퍼스 v2의
# 발굴 가설(HYP-003·004) 축. 실행 이후의 모든 변경은 SCP 경로만 유효하다 (DECISIONS 08/21).

version: "0.1"
product: XCOPRI

fields:
  signal_type:
    label_ko: 신호 유형
    required: true
    field_form: true          # Field 앱 입력 폼에 노출
    values:
      - { value: UNMET_NEED,        label_ko: 미충족 수요 }
      - { value: TREATMENT_BARRIER, label_ko: 치료 장벽 }
      - { value: INFO_REQUEST,      label_ko: 자료 요청 }
      - { value: POSITIVE_OUTCOME,  label_ko: 긍정 경과 }
      - { value: ACCESS_ISSUE,      label_ko: 접근성 문제 }
      - { value: REPURPOSING_SIGNAL, label_ko: 리퍼포징 신호(미허가 적응증) }   # 08/19 부트스트랩 — label_scope 자동 OUT_OF_LABEL
      - { value: SAFETY_CANDIDATE,  label_ko: 안전성 후보(자동 분기) }
      - { value: OTHER,             label_ko: 기타 }

  patient_segment:
    label_ko: 환자군
    required: true
    field_form: true
    values:
      - { value: PEDIATRIC_TRANSITION, label_ko: 청소년(12–17세) 전환기, label_scope: OUT_OF_LABEL }
      - { value: GENERALIZED_PGTC,     label_ko: 전신 강직-간대발작(PGTC), label_scope: OUT_OF_LABEL }   # 08/21 재확정 — 허가는 초점발작
      - { value: LGS,                  label_ko: 레녹스-가스토 증후군(LGS), label_scope: OUT_OF_LABEL }   # 08/21 재확정
      - { value: ELDERLY_65_PLUS,      label_ko: 노인(65세 이상) }
      - { value: DRE_2PLUS,            label_ko: 약물난치성(2제 이상 실패) }
      - { value: COMORBID_PSYCH,       label_ko: 정신과 동반질환 }
      - { value: FEMALE_CHILDBEARING,  label_ko: 가임기 여성 }
      - { value: NEW_ONSET_ADULT,      label_ko: 신규 진단 성인 }
      - { value: UNSPECIFIED,          label_ko: 미지정 }

  journey_stage:
    label_ko: 여정 단계
    required: false
    field_form: true
    values:
      - { value: DIAGNOSIS,       label_ko: 진단 }
      - { value: INITIATION,      label_ko: 시작 }
      - { value: TITRATION,       label_ko: 용량 적정 }
      - { value: MAINTENANCE,     label_ko: 유지 }
      - { value: SWITCH,          label_ko: 전환 }
      - { value: DISCONTINUATION, label_ko: 중단 }

  barrier_type:
    label_ko: 장벽 유형
    required_if: { field: signal_type, equals: TREATMENT_BARRIER }
    field_form: true
    values:
      - { value: TITRATION_COMPLEXITY, label_ko: 적정 복잡성 }
      - { value: DDI_CONCERN,          label_ko: 약물 상호작용 우려 }
      - { value: MONITORING_BURDEN,    label_ko: 모니터링 부담 }
      - { value: REIMBURSEMENT,        label_ko: 급여·보험 }
      - { value: AWARENESS_GAP,        label_ko: 인지 격차 }
      - { value: FORMULATION_NEED,     label_ko: 제형 요구 }

  # ── 08/19 부트스트랩 반영 (AI 독립 초안 × 36컬럼 원안 × v0.1 3자 대조 — DECISIONS 08/19) ──
  solicitation:
    label_ko: 발언 경위
    required: false
    field_form: false          # 추출 산출 — 오프라벨 언급의 컴플라이언스 의미가 갈리는 축 (AI 초안의 발견)
    values:
      - { value: UNSOLICITED,      label_ko: 자발적 언급 }
      - { value: SOLICITED_BY_MSL, label_ko: MSL 질문에 답변 }
      - { value: UNCLEAR,          label_ko: 불명확 }

  indication_mention:
    label_ko: 언급된 적응증(원문)
    type: text                 # enum 아님 — patient_segment의 SCP 각본(POST_STROKE)과 분리 유지
    required: false
    field_form: false

  concomitant_drugs:
    label_ko: 병용 약물명
    type: text                 # 쉼표 구분. 정규화는 vocab 계층에서
    required: false
    field_form: false

  administration_note:
    label_ko: 투여법·제형 관찰
    type: text                 # crushed 등 복용 방식 언급. 용량 수치는 의도적 제외 (규제 민감)
    required: false
    field_form: false

  sentiment:
    label_ko: 발언 논조
    required: false
    field_form: false          # 08/19 도메인 오너 판단으로 채택. **HCP 개인별 집계 금지** (절대규칙 #7) — 세그먼트·토픽 단위만
    values:
      - { value: POSITIVE, label_ko: 긍정 }
      - { value: NEUTRAL,  label_ko: 중립 }
      - { value: NEGATIVE, label_ko: 부정 }
      - { value: MIXED,    label_ko: 혼재 }

# 자동판정 규칙 (LLM이 아니라 서버가 결정론적으로 계산)
derivations:
  label_scope:
    rule: "signal_type이 REPURPOSING_SIGNAL이면 OUT_OF_LABEL; 아니면 patient_segment의 values에 label_scope가 명시된 값이면 그 값, 아니면 IN_LABEL"
  purpose_domain:
    rule: "signal_type 기준: ACCESS_ISSUE → COMMERCIAL, SAFETY_CANDIDATE → SAFETY(별도 경로), 그 외 → MEDICAL"
